name: Build and Deploy Static Storefront to Azure

on:
  push:
    branches:
      - main
      - feature/automation-pipeline

permissions:
  contents: read
  id-token: write

jobs:
  deploy-storefront:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code from Repository
        uses: actions/checkout@v3

      - name: Set up Terraform Engine
        uses: hashicorp/setup-terraform@v2

      - name: Run Terraform Initialization
        run: terraform init
        id: init
        working-directory: . # Changed back to root because your main.tf sits in the main repository path
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

      - name: Execute Automated Cloud Deployment
        run: terraform apply -auto-approve
        working-directory: . # Changed back to root because your main.tf sits in the main repository path
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Sync HTML Content to Nginx Container
        uses: azure/CLI@v1
        with:
          azcliversion: latest
          inlineScript: |
            echo "Uploading storefront assets to the container..."
            az containerapp replica count set \
              --name biovita-organic-store-final2 \
              --resource-group rg-organic-wellness-store-final2 \
              --count 1
