name: Build and Deploy Static Storefront to Azure

# Trigger this pipeline automatically whenever code is merged into the main branch
on:
  push:
    branches:
      - main

jobs:
  deploy-storefront:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code from Repository
        uses: actions/checkout@v3

      - name: Build And Deploy Store to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          # Secure API token generated automatically by our cloud infrastructure setup
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          ###### Directory Locations ######
          app_location: "/"          # Where your index.html lives
          api_location: ""           # Optional backend API path (leave empty for now)
          output_location: "/"       # Where built assets reside
