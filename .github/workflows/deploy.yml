name: Build and Deploy Static Storefront to Azure

on:
  push:
    branches:
      - main
      - feature/automation-pipeline

permissions:
  contents: read
  id-token: write

jobs:
  deploy-storefront:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code from Repository
        uses: actions/checkout@v3

      - name: Set up Terraform Engine
        uses: hashicorp/setup-terraform@v2

      - name: Run Terraform Initialization
        run: terraform init
        id: init
        working-directory: .
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

      - name: Execute Automated Cloud Deployment
        run: terraform apply -auto-approve
        working-directory: .
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      # Targets the brand-new clean final7 container layout with the automated wait engine
      - name: Deploy Frontend Assets to Nginx Container
        uses: azure/CLI@v1
        with:
          azcliversion: latest
          inlineScript: |
            echo "Waiting for the new Container App replica slot to initialize..."
            REPLICA_NAME=""
            ATTEMPTS=0
            MAX_ATTEMPTS=12
            
            while [ -z "$REPLICA_NAME" ] && [ $ATTEMPTS -lt $MAX_ATTEMPTS ]; do
              REPLICA_NAME=$(az containerapp replica list \
                --name biovita-organic-store-final7 \
                --resource-group rg-organic-wellness-store-final7 \
                --query ".name" -o tsv)
              
              if [ -z "$REPLICA_NAME" ]; then
                echo "Replica not ready yet. Retrying in 10 seconds... (Attempt $((ATTEMPTS+1))/$MAX_ATTEMPTS)"
                sleep 10
                ATTEMPTS=$((ATTEMPTS+1))
              fi
            done
            
            if [ -z "$REPLICA_NAME" ]; then
              echo "Error: Timed out waiting for Azure Container App replica to initialize."
              exit 1
            fi
            
            echo "Replica found: $REPLICA_NAME. Deploying production assets..."
            
            az containerapp replica exec \
              --name biovita-organic-store-final7 \
              --resource-group rg-organic-wellness-store-final7 \
              --replica $REPLICA_NAME \
              --container web-storefront \
              --command "mkdir -p /usr/share/nginx/html"
              
            tar -czf - index.html | az containerapp replica exec \
              --name biovita-organic-store-final7 \
              --resource-group rg-organic-wellness-store-final7 \
              --replica $REPLICA_NAME \
              --container web-storefront \
              --command "tar -xzf - -C /usr/share/nginx/html"
