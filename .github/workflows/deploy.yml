name: Build and Deploy Static Storefront to Azure

on:
  push:
    branches:
      - main

jobs:
  deploy-storefront:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code from Repository
        uses: actions/checkout@v3

      - name: Sync Storefront Assets to Azure Blob Storage
        uses: azure/CLI@v1
        with:
          azcliversion: latest
          inlineScript: |
            az storage blob upload-batch --account-name biovitaorganicsstore2 --auth-mode key --source . --destination '$web' --connection-string "${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" --overwrite true
