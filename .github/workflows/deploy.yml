name: Build and Deploy Static Storefront to Azure

on:
  push:
    branches:
      - main
      - feature/automation-pipeline

permissions:
  contents: read
  id-token: write

jobs:
  deploy-storefront:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code from Repository
        uses: actions/checkout@v3

      - name: Set up Terraform Engine
        uses: hashicorp/setup-terraform@v2

      - name: Run Terraform Initialization
        run: terraform init
        id: init
        working-directory: .
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

      - name: Execute Automated Cloud Deployment
        id: apply
        run: terraform apply -auto-approve
        working-directory: .
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

      # Fixed: Uses the native secure token to bypass Azure CLI authentication blocks
      - name: Upload Storefront Assets using SAS Token
        run: |
          echo "Extracting upload token..."
          SAS_TOKEN=$(terraform output -raw sas_token)
          
          echo "Uploading index.html directly to web container folder..."
          az storage blob upload \
            --account-name biovitasstorefinal11 \
            --container-name '$web' \
            --name index.html \
            --file index.html \
            --sas-token "$SAS_TOKEN"
